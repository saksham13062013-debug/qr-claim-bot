<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --ok: #22c55e;
      --bad: #ef4444;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 1rem;
      margin: 0.75rem 0;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      text-align: center;
    }
    .stats div {
      background: #0f1419;
      border-radius: 10px;
      padding: 0.65rem 0.35rem;
    }
    .stats b { display: block; font-size: 1.15rem; }
    .stats span { font-size: 0.7rem; color: var(--muted); }
    #reader { border-radius: 12px; overflow: hidden; }
    .result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .result.ok { display: block; background: rgba(34,197,94,0.15); border: 1px solid var(--ok); }
    .result.bad { display: block; background: rgba(239,68,68,0.12); border: 1px solid var(--bad); }
    input, button {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid #2a3548;
      background: #0f1419;
      color: var(--text);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 0.5rem;
      padding: 0.7rem;
      border-radius: 10px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
    }
    code { background: #0f1419; padding: 0.15rem 0.4rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>QR Scanner</h1>
    <p class="muted">Scan task QR codes. Your Scanner ID tracks success rate.</p>

    <div class="card">
      <div class="muted">Scanner ID</div>
      <div style="font-size:1.1rem;font-weight:700;margin:0.25rem 0" id="sidLabel">—</div>
      <div class="stats" style="margin-top:0.75rem">
        <div><b id="sAttempts">0</b><span>Attempts</span></div>
        <div><b id="sSuccess">0</b><span>Success</span></div>
        <div><b id="sRate">0%</b><span>Success rate</span></div>
      </div>
    </div>

    <div class="card">
      <div id="reader"></div>
      <div id="result" class="result"></div>
      <p class="muted" style="margin-top:0.75rem">Or paste code / link manually:</p>
      <input id="manual" placeholder="QR code or payment link" />
      <button class="primary" type="button" onclick="submitManual()">Check</button>
    </div>

    <p class="muted" style="text-align:center">
      Get your ID in Telegram: <code>/scanner</code>
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    let scannerId = (params.get("sid") || localStorage.getItem("scanner_id") || "").toUpperCase();
    const botUser = {{ bot_username|tojson }};

    function setStats(d) {
      if (!d) return;
      if (d.scanner_id) {
        scannerId = d.scanner_id;
        localStorage.setItem("scanner_id", scannerId);
        document.getElementById("sidLabel").textContent = scannerId;
      }
      if (d.scan_attempts != null) document.getElementById("sAttempts").textContent = d.scan_attempts;
      if (d.scan_successes != null) document.getElementById("sSuccess").textContent = d.scan_successes;
      if (d.success_rate != null) document.getElementById("sRate").textContent = d.success_rate + "%";
    }

    async function loadProfile() {
      if (!scannerId) {
        document.getElementById("sidLabel").textContent = "Not linked — open /scanner in bot";
        return;
      }
      document.getElementById("sidLabel").textContent = scannerId;
      try {
        const r = await fetch("/api/scanner/profile?scanner_id=" + encodeURIComponent(scannerId));
        const d = await r.json();
        if (d.ok) setStats(d);
      } catch (e) {}
    }

    async function submitPayload(raw) {
      const result = document.getElementById("result");
      result.className = "result";
      result.style.display = "none";
      try {
        const r = await fetch("/api/scanner/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scanner_id: scannerId || null, payload: raw }),
        });
        const d = await r.json();
        setStats(d);
        result.style.display = "block";
        result.className = "result " + (d.success ? "ok" : "bad");
        let html = "<b>" + (d.success ? "Success" : "Not claimable") + "</b><br>" + (d.message || "");
        if (d.code) html += "<br>Code: <code>" + d.code + "</code>";
        if (d.reward_usd != null) html += "<br>Reward: $" + d.reward_usd.toFixed(2);
        if (d.app_name) html += "<br>App: " + d.app_name;
        if (d.payment_link) {
          html += '<br><a class="btn" href="' + d.payment_link + '" target="_blank" rel="noopener">Open link</a>';
        }
        if (botUser) {
          html += '<a class="btn" style="background:var(--primary)" href="https://t.me/' + botUser + '?start=claim_' + (d.code || "") + '">Open bot to claim</a>';
        }
        result.innerHTML = html;
      } catch (e) {
        result.style.display = "block";
        result.className = "result bad";
        result.textContent = "Network error. Try again.";
      }
    }

    function submitManual() {
      const v = document.getElementById("manual").value.trim();
      if (!v) return;
      submitPayload(v);
    }

    let lastScan = "";
    let lastAt = 0;
    function onScanSuccess(decoded) {
      const now = Date.now();
      if (decoded === lastScan && now - lastAt < 2500) return;
      lastScan = decoded;
      lastAt = now;
      submitPayload(decoded);
    }

    loadProfile();

    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then((devices) => {
      const camId = devices && devices.length ? devices[devices.length - 1].id : { facingMode: "environment" };
      html5QrCode.start(
        camId,
        { fps: 8, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).catch(() => {
        document.getElementById("reader").innerHTML =
          '<p class="muted">Camera unavailable. Use manual paste below. (HTTPS required on phone)</p>';
      });
    }).catch(() => {
      document.getElementById("reader").innerHTML =
        '<p class="muted">Camera permission denied. Paste code manually.</p>';
    });
  </script>
</body>
</html>
