{% extends "base.html" %}{% block content %}<h1>Users</h1><div class="card"><table><tr><th>Telegram ID</th><th>Username</th><th>Name</th><th>Balance</th><th>Status</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.username or "—"}}</td><td>{{u.first_name}}</td><td>{{"%.2f"|format(u.balance)}} {{currency}}</td><td>{{"Online" if u.active else "Offline"}}</td></tr>{% endfor %}</table></div>{% endblock %}
