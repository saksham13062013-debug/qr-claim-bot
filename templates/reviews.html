{% extends "base.html" %}{% block content %}<h1>Pending reviews</h1><div class="card"><table><tr><th>Task</th><th>Worker</th><th>Reward</th><th>Actions</th></tr>{% for t in tasks %}<tr><td>#{{t.id}} — {{t.title}}</td><td>{{t.username or t.first_name}}</td><td>{{"%.2f"|format(t.reward)}} {{currency}}</td><td><form class="inline" method="post" action="/reviews/{{t.id}}/approve"><button>Approve</button></form><form class="inline" method="post" action="/reviews/{{t.id}}/reject"><button class="danger">Reject</button></form></td></tr>{% else %}<tr><td colspan="4">No pending reviews.</td></tr>{% endfor %}</table></div>{% endblock %}
